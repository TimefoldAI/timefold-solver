########################
# Timefold application info
########################
timefold.model.name=Timefold SDK - Integration Tests
timefold.model.api-version=v1

########################
# OpenAPI ans swagger ui configuration
########################
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.title=${timefold.model.name}
quarkus.smallrye-openapi.store-schema-directory=target/openapi-schema
mp.openapi.extensions.smallrye.info.title=${timefold.model.name}
mp.openapi.extensions.smallrye.info.version=${timefold.model.api-version}

timefold.storage.path=target
timefold.storage.ttl=P1D

timefold.model.default-config.resources.memory.mi=256
timefold.model.default-config.resources.cpu.cores=1
timefold.model.default-config.termination.spent-limit=PT30M
timefold.model.default-config.termination.unimproved-spent-limit=PT5M
timefold.model.termination.spent-limit=PT30S

# Useful for verifying bytecode generated using Gizmo
#quarkus.package.jar.decompiler.enabled=true